#
# Summary:
# This GitHub Actions workflow automates the release process using Release Please.
# It triggers on pushes to the main branch, generates a GitHub App token using organization
# variables and secrets, and then runs the release-please-action to manage versioning and changelogs.

name: Release Please

on:
  push:
    branches:
      - main
      - support/v1
      - support/v2
  pull_request:
    paths:
      - .github/release-please/**
      - .github/workflows/release-please-gha.yml
      - release-please-config.json
      - hidi-release-please-config.json
      - .release-please-manifest.json
      - .hidi-release-please-manifest.json
      - Directory.Build.props
      - src/Microsoft.OpenApi.Hidi/Microsoft.OpenApi.Hidi.csproj
      - src/Microsoft.OpenApi.Hidi/readme.md

permissions:
  contents: read

jobs:
  release-please-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/release-please
      - run: npm test
        working-directory: .github/release-please
  check-secret:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        run: echo "has-token=${{ secrets.RELEASE_PLEASE_TOKEN_PROVIDER_PEM != '' }}" >> $GITHUB_OUTPUT
  release-please-master:
    needs: [check-secret, release-please-tests]
    if: github.event_name == 'push' && needs.check-secret.outputs.has-token == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/release-please

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_TOKEN_PROVIDER_PEM }}

      - name: Release Please
        id: release
        env:
          RELEASE_PLEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/release-please/run.cjs odata

  release-please-hidi:
    needs: [check-secret, release-please-tests]
    # Version PRs only; production tags and publishing remain gated.
    if: github.event_name == 'push' && needs.check-secret.outputs.has-token == 'true' && (github.ref_name == 'main' || github.ref_name == 'support/v2')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/release-please
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_TOKEN_PROVIDER_PEM }}
      - name: Release Please (independent hidi version)
        id: release
        env:
          RELEASE_PLEASE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/release-please/run.cjs hidi
