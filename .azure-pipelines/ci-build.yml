name: $(BuildDefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - support/v1
      - support/v2
  tags:
    include:
      - 'v2.*'
pr:
  branches:
    include:
      - main
      - support/v1
      - support/v2

variables:
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'
  ProductBinPath: '$(Build.SourcesDirectory)\bin\$(BuildConfiguration)'

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-latest
      os: windows
      demands:
      - msbuild
      - vstest
    customBuildTags:
    - ES365AIMigrationTooling 
    stages:

    - stage: build
      jobs:
        - job: build
          templateContext:
            outputs:
            - output: pipelineArtifact
              displayName: 'Publish Artifact: Nugets'
              artifactName: Nugets
              targetPath: '$(Build.ArtifactStagingDirectory)'
          steps:

          - pwsh: |
              $ErrorActionPreference = 'Stop'
              $version = ([xml](Get-Content -LiteralPath Directory.Build.props)).SelectSingleNode('/Project/PropertyGroup/Version').InnerText
              if ($version -cnotmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid OData project version: $version." }
              $sourceBranch = $env:BUILD_SOURCEBRANCH
              if ($sourceBranch.StartsWith('refs/tags/')) {
                if ($sourceBranch -cnotmatch '^refs/tags/v2\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
                  throw "This pipeline only releases OData v2.* tags."
                }
                if ($sourceBranch -cne "refs/tags/v$version") { throw "OData tag must exactly match Directory.Build.props version." }
              }
              Write-Host "##vso[task.setvariable variable=ODataVersion]$version"
            displayName: 'Verify OData component tag and project version'

          - task: UseDotNet@2
            displayName: 'Use .NET 6' # needed for ESRP signing
            inputs:
              version: 6.x

          - task: UseDotNet@2
            displayName: 'Use .NET 8'
            inputs:
              version: 8.x

          - task: UseDotNet@2
            displayName: 'Use .NET 10 for hidi tests'
            inputs:
              version: 10.x

          # Install the nuget tool.
          - task: NuGetToolInstaller@1
            displayName: 'Use NuGet >=6.11.0'
            inputs:
              versionSpec: '>=6.11.0'
              checkLatest: true

          - task: NuGetAuthenticate@1
            displayName: 'Authenticate approved NuGet feed'

          - pwsh: |
              @'
              <?xml version="1.0" encoding="utf-8"?>
              <configuration>
                <packageSources>
                  <clear />
                  <add key="GraphDeveloperExperiences_Public" value="https://microsoftgraph.pkgs.visualstudio.com/0985d294-5762-4bc2-a565-161ef349ca3e/_packaging/GraphDeveloperExperiences_Public/nuget/v3/index.json" />
                </packageSources>
              </configuration>
              '@ | Set-Content -Path '$(Build.SourcesDirectory)\nuget.config'
            displayName: 'Configure approved NuGet feed'

          # Build the Product project
          - task: DotNetCoreCLI@2
            displayName: 'build'
            inputs:
              projects: '$(Build.SourcesDirectory)\Microsoft.OpenApi.OData.sln'
              arguments: '--configuration $(BuildConfiguration) --no-incremental'

          # Both test projects are in the solution, but SDK10 cannot run MTP via VSTest.
          # Keep OData on VSTest and invoke the hidi MTP executable separately.
          - task: DotNetCoreCLI@2
            displayName: 'test'
            inputs:
              command: test
              projects: '$(Build.SourcesDirectory)\test\Microsoft.OpenAPI.OData.Reader.Tests\Microsoft.OpenAPI.OData.Reader.Tests.csproj'
              arguments: '--configuration $(BuildConfiguration) --no-build'

          - pwsh: |
              dotnet run --project test\Microsoft.OpenApi.Hidi.Tests\Microsoft.OpenApi.Hidi.Tests.csproj -c $(buildConfiguration) --no-build -- --minimum-expected-tests 1
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: 'Test hidi (Microsoft.Testing.Platform)'

          - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
            displayName: 'ESRP CodeSigning'
            inputs:
              ConnectedServiceName: 'Federated DevX ESRP Managed Identity Connection'
              FolderPath: 'bin\$(BuildConfiguration)'
              Pattern: 'Microsoft.OpenApi.OData.Reader.dll'
              AppRegistrationClientId: '65035b7f-7357-4f29-bf25-c5ee5c3949f8'
              AppRegistrationTenantId: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
              AuthAKVName: 'akv-prod-eastus'
              AuthCertName: 'ReferenceLibraryPrivateCert'
              AuthSignCertName: 'ReferencePackagePublisherCertificate'
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                    {
                        "keyCode": "CP-230012",
                        "operationSetCode": "SigntoolSign",
                        "parameters": [
                        {
                            "parameterName": "OpusName",
                            "parameterValue": "Microsoft"
                        },
                        {
                            "parameterName": "OpusInfo",
                            "parameterValue": "http://www.microsoft.com"
                        },
                        {
                            "parameterName": "FileDigest",
                            "parameterValue": "/fd \"SHA256\""
                        },
                        {
                            "parameterName": "PageHash",
                            "parameterValue": "/NPH"
                        },
                        {
                            "parameterName": "TimeStamp",
                            "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
                        }
                        ],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                    },
                    {
                        "keyCode": "CP-230012",
                        "operationSetCode": "SigntoolVerify",
                        "parameters": [ ],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                    }
                ]
              SessionTimeout: '20'
              MaxConcurrency: '50'
              MaxRetryAttempts: '5'
              PendingAnalysisWaitTimeoutMinutes: '5'

          # Pack
          - task: DotNetCoreCLI@2
            displayName: 'pack'
            inputs:
              command: pack
              packagesToPack: src/Microsoft.OpenApi.OData.Reader/Microsoft.OpenAPI.OData.Reader.csproj
              configuration: '$(BuildConfiguration)'
              packDirectory: '$(Build.ArtifactStagingDirectory)'
              nobuild: true
              includesymbols: true
              includesource: true
              buildProperties: 'SymbolPackageFormat=snupkg'

          - task: SFP.build-tasks.custom-build-task-1.EsrpCodeSigning@5
            displayName: 'ESRP CodeSigning Nuget Packages'
            inputs:
              ConnectedServiceName: 'Federated DevX ESRP Managed Identity Connection'
              FolderPath: '$(Build.ArtifactStagingDirectory)'
              AppRegistrationClientId: '65035b7f-7357-4f29-bf25-c5ee5c3949f8'
              AppRegistrationTenantId: 'cdc5aeea-15c5-4db6-b079-fcadd2505dc2'
              AuthAKVName: 'akv-prod-eastus'
              AuthCertName: 'ReferenceLibraryPrivateCert'
              AuthSignCertName: 'ReferencePackagePublisherCertificate'              
              Pattern: 'Microsoft.OpenApi.OData.$(ODataVersion).nupkg'
              signConfigType: inlineSignParams
              inlineOperation: |
                [
                    {
                        "keyCode": "CP-401405",
                        "operationSetCode": "NuGetSign",
                        "parameters": [ ],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                    },
                    {
                        "keyCode": "CP-401405",
                        "operationSetCode": "NuGetVerify",
                        "parameters": [ ],
                        "toolName": "sign",
                        "toolVersion": "1.0"
                    }
                ]
              SessionTimeout: '60'
              MaxConcurrency: '50'
              MaxRetryAttempts: '5'
              PendingAnalysisWaitTimeoutMinutes: '5'

    - stage: deploy
      condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v2.'))
      dependsOn: build
      jobs:
        - deployment: deploy
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: Nugets
              targetPath: '$(Pipeline.Workspace)'
          environment: nuget-org
          strategy:
            runOnce:
              deploy:
                pool:
                  vmImage: ubuntu-latest
                steps:
                - pwsh: |
                    $ErrorActionPreference = 'Stop'
                    $sourceBranch = $env:BUILD_SOURCEBRANCH
                    if ($sourceBranch -cnotmatch '^refs/tags/v2\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Expected an OData v2.* release tag." }
                    $version = $sourceBranch.Substring('refs/tags/v'.Length)
                    $packages = @(Get-ChildItem -LiteralPath '$(Pipeline.Workspace)' -Filter '*.nupkg' -File -Recurse)
                    if ($packages.Count -ne 1 -or $packages[0].Name -cne "Microsoft.OpenApi.OData.$version.nupkg") {
                      throw "Expected only the exact OData package matching the triggering tag."
                    }
                    $symbols = Join-Path $packages[0].DirectoryName "Microsoft.OpenApi.OData.$version.snupkg"
                    if (-not (Test-Path -LiteralPath $symbols -PathType Leaf)) {
                      throw "Missing exact OData symbols package for $version."
                    }
                    Write-Host "##vso[task.setvariable variable=ODataReleaseVersion]$version"
                    Write-Host "##vso[task.setvariable variable=ODataPackagePath]$($packages[0].FullName)"
                  displayName: 'Verify tagged OData package and symbols'
                - task: 1ES.PublishNuget@1
                  displayName: 'NuGet push'
                  inputs:
                    packagesToPush: '$(ODataPackagePath)'
                    nuGetFeedType: external
                    publishFeedCredentials: 'OpenAPI Nuget Connection'
                    packageParentPath: '$(Pipeline.Workspace)'

        - deployment: create_github_release
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: Nugets
              targetPath: '$(Pipeline.Workspace)'
          dependsOn: []
          environment: kiota-github-releases
          strategy:
            runOnce:
              deploy:
                pool:
                  vmImage: ubuntu-latest
                steps:
                - pwsh: |
                    $ErrorActionPreference = 'Stop'
                    $sourceBranch = $env:BUILD_SOURCEBRANCH
                    if ($sourceBranch -cnotmatch '^refs/tags/v2\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Expected an OData v2.* release tag." }
                    $version = $sourceBranch.Substring('refs/tags/v'.Length)
                    $packages = @(Get-ChildItem -LiteralPath '$(Pipeline.Workspace)' -Filter '*.nupkg' -File -Recurse)
                    if ($packages.Count -ne 1 -or $packages[0].Name -cne "Microsoft.OpenApi.OData.$version.nupkg") {
                      throw "Expected only the exact OData package matching the triggering tag."
                    }
                    $symbols = Join-Path $packages[0].DirectoryName "Microsoft.OpenApi.OData.$version.snupkg"
                    if (-not (Test-Path -LiteralPath $symbols -PathType Leaf)) {
                      throw "Missing exact OData symbols package for $version."
                    }
                    Write-Host "##vso[task.setvariable variable=ODataReleaseVersion]$version"
                    Write-Host "##vso[task.setvariable variable=ODataPackagePath]$($packages[0].FullName)"
                  displayName: 'Verify tagged OData release artifact'
                - task: GitHubRelease@1
                  displayName: 'GitHub release'
                  condition: succeeded()
                  inputs:
                    gitHubConnection: 'Github-MaggieKimani1'
                    action: edit
                    tagSource: userSpecifiedTag
                    tag: 'v$(ODataReleaseVersion)'
                    title: 'v$(ODataReleaseVersion)'
                    releaseNotesSource: inline
                    assets: '$(ODataPackagePath)'
                    addChangeLog: false   
